<div id="predictionModal" class="modal-overlay">
  <div class="modal-container modal-md prediction-modal">
    <div class="modal-header">
      <div class="modal-team-info">
        <div>
          <h2 id="predictionMatchTitle">Score Prediction</h2>
          <p id="predictionMatchSubtitle">Analytics & AI insight for this fixture</p>
        </div>
      </div>
      <button class="modal-close" id="predictionClose" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body prediction-modal-body">
      <div class="prediction-tabs" id="predictionTabs" hidden>
        <button type="button" class="prediction-tab active" data-tab="ml">AI Prediction</button>
        <button type="button" class="prediction-tab" data-tab="h2h">H2H Analytics</button>
      </div>
      <div id="predictionAnalytics"></div>
      <div class="prediction-guess">
        <div class="analytics-section-title">Your score guess</div>
        <div class="prediction-form">
          <div class="prediction-side">
            <div class="prediction-team" id="predictionHomeTeam">Home</div>
            <input type="number" id="predHomeScore" class="prediction-score-input" min="0" max="20" placeholder="0" />
          </div>
          <div class="prediction-vs">VS</div>
          <div class="prediction-side">
            <div class="prediction-team" id="predictionAwayTeam">Away</div>
            <input type="number" id="predAwayScore" class="prediction-score-input" min="0" max="20" placeholder="0" />
          </div>
        </div>
        <button class="btn-primary btn-full" id="submitPrediction" type="button">Submit Prediction</button>
      </div>
    </div>
  </div>
</div>
